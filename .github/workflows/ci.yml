name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test SehatCore
        working-directory: Packages/SehatCore
        run: swift test --enable-code-coverage