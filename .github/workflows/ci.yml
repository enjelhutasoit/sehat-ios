name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [SehatCore, SehatNetworking, SehatDomain, SehatPersistence]
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: swift test --enable-code-coverage
