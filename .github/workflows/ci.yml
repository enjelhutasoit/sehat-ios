name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTLANE_OPT_OUT_USAGE: "1"
  FASTLANE_SKIP_UPDATE_CHECK: "1"

jobs:
  packages:
    name: Package tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is arm64. macos-15-intel is x64, like the development Mac.
        # Remove the second entry if GitHub retires that label.
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Tooling tests
        run: bundle exec fastlane tooling_tests
      - name: Package tests and coverage
        run: bundle exec fastlane package_tests

  app:
    name: App build and UI tests (macos-15)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: UI tests
        run: bundle exec fastlane ui_tests
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: build/ui-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore
